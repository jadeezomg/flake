  openaiWebsockets: auto
  anthropic:
    serverSideFallback: false
exa:
  enabled: false
searxng:
  endpoint: ""
astGrep:
  enabled: true
astEdit:
  enabled: true
recipe:
  enabled: true
fetch:
  enabled: true
browser:
  enabled: true
  headless: true
  screenshotDir: ~/Pictures/Agent
  cmux: false
