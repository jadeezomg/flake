modelRoles:
  plan: openai-codex/gpt-6-astra:xhigh
  default: openai-codex/gpt-6.1-sol
theme:
  dark: birds-of-paradise
  light: light-gruvbox
symbolPreset: nerd
statusLine:
  preset: compact
  separator: slash
  sessionAccent: true
  showHookStatus: true
  compactThinkingLevel: true
  transparent: true
terminal:
  showImages: true
  showProgress: true
display:
  showTokenUsage: true
  shimmer: kitt
  smoothStreaming: true
  cacheMissMarker: true
autoResume: true
startup:
  checkUpdate: false
compaction:
  thresholdPercent: 80
  handoffSaveToDisk: true
  idleEnabled: true
  methodOrder:
    - shake
    - remote
    - soft
memory:
  backend: "off"
edit:
  mode: hashline
  streamingAbort: true
  hashlineAutoDropPureInsertDuplicates: true
readLineNumbers: false
bashInterceptor:
  enabled: true
python:
  sharedGateway: true
  kernelMode: session
lsp:
  enabled: true
  diagnosticsOnWrite: false
  formatOnWrite: true
todo:
  reminders: true
  eager: default
irc:
  enabled: false
debug:
  enabled: false
renderMermaid:
  enabled: true
github:
  enabled: true
mcp:
  enableProjectConfig: true
  notifications: true
plan:
  enabled: true
task:
  isolation:
    merge: patch
    commits: generic
    enabled: false
  maxConcurrency: 8
  eager: default
commands:
  enableOpencodeUser: false
  enableOpencodeProject: false
secrets:
  enabled: true
providers:
  kimiApiFormat: auto
  openaiWebsockets: auto
exa:
  enabled: false
searxng:
  endpoint: ""
astGrep:
  enabled: true
astEdit:
  enabled: true
recipe:
  enabled: true
fetch:
  enabled: true
browser:
  enabled: true
  headless: true
  screenshotDir: ~/Pictures/Agent
  cmux: false
tools:
  intentTracing: true
  approvalMode: yolo
autocompleteMaxVisible: 15
dev:
  autoqaConsent: granted
bash:
  autoBackground:
    enabled: true
async:
  enabled: true
checkpoint:
  enabled: true
defaultThinkingLevel: auto
hideThinkingBlock: false
retry:
  fallbackRevertPolicy: cooldown-expiry
steeringMode: one-at-a-time
loop:
  mode: prompt
doubleEscapeAction: tree
treeFilterMode: default
repeatToolDescriptions: false
setupVersion: 2
tier:
  openai: auto
tui:
  tight: true
  textSizing: false
images:
  blockImages: true
personality: pragmatic
includeWorkspaceTree: false
inlineToolDescriptors: auto
advisor:
  enabled: false
interruptMode: immediate
ask:
  notify: "on"
prewalk:
  enabled: true
contextPromotion:
  enabled: false
composer:
  shape: box
  tokenRate: false
codexResets:
  autoRedeem: "yes"