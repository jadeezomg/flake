# Age key model (see docs/secrets/sops-age-keys.md):
#   editor  — your personal key (~/.config/sops/age/keys.txt); edit secrets from any dev machine
#   <host>  — per-machine runtime key (/var/lib/private/sops/age/keys.txt on NixOS; HM path on Darwin)
#
# Editor key
# mkdir -p ~/.config/sops/age
# age-keygen -o ~/.config/sops/age/keys.txt
# age-keygen -y ~/.config/sops/age/keys.txt
#
# NixOS host key (on each NixOS box)
# just bootstrap-sops-host-key     # first install only (empty path)
# just rotate-sops-host-key        # dedicated key after Phase 1 editor copy
# just verify-sops-host-key framework
#
# Rekey after editing recipients:
# sops updatekeys secrets/secrets.yaml

keys:
    # Personal editing key — sync ~/.config/sops/age/keys.txt to machines where you run `sops`.
    - &editor age1pmtv9wwwfmsjp5pud8afv7c6cvjyc54t2attmr5wukvvtnu0kdvqsrxmj2

    # Framework NixOS host runtime key.
    - &framework age1nkadhmd3f5y7zeme8tjftkdjxsgyz8rwu2nqcrl5tu4t9enj0q0sp7n42u

    # Desktop NixOS host runtime key
    # - &desktop age1s6yrgxcpwm8qy3cpjc2fz6pyq76afd33e2kfg7q58q69ehxwzd2s6qjrxu
    # - &desktop age1me2u0t6xnp4g2gnzvu6dthclrr9qjn7raud37gyj2j2cx2myjc4qzdep49
    - &desktop age1y9h34vax2fkhlluxadltze4djctcsszznldq24d66pmj3r7kfuzss9h083

    - &caya age1yrt6l02984f5gemerpzlf5v4ymakdmf45qhu3ecy2qtjwuzn43tqh755nz

    # Mini NixOS host — add after `just bootstrap-sops-host-key` on mini (see docs/hosts/mini-install.md §5.4)
    # - &mini age1...

creation_rules:
    - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
      key_groups:
          - age:
                - *editor
                - *framework
                - *desktop
                - *caya
                # - *mini
