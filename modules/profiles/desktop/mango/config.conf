# Mango config. It copies niri/config.kdl where mango has an equivalent.
# Docs: https://mangowm.github.io  Check: mango -c ~/.config/mango/config.conf -p
# Mango sets XDG_CURRENT_DESKTOP=mango and starts mango-session.target itself.

# Input (niri: input {})
xkb_rules_layout=us,de
xkb_rules_variant=intl
xkb_rules_options=compose:ralt,caps:hyper
numlockon=1

tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=1
trackpad_disable_while_typing=0
trackpad_scroll_factor=0.8
trackpad_accel_speed=0.0

mouse_accel_profile=1
mouse_accel_speed=0.0

# niri focus-follows-mouse max-scroll-amount="0%": focus on hover, never scroll.
sloppyfocus=1
edge_scroller_pointer_focus=0
warpcursor=0

# Layout (niri: layout {}). Scroller is the niri-style column strip.
tagrule=id:*,layout_name:scroller
circle_layout=scroller,tile

gappih=10
gappiv=10
gappoh=10
gappov=10

scroller_structs=0
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=0
scroller_default_proportion=0.5
scroller_proportion_preset=0.33333,0.5,0.66667

# niri focus-ring width 3, #372725. The noctalia shell file sets the radius.
borderpx=3
bordercolor=0x372725ff
focuscolor=0x372725ff
rootcolor=0x00000000

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=5
shadows_blur=30
shadows_position_x=0
shadows_position_y=5
shadowscolor=0x00000080

# niri blur {}. No layer blur: Noctalia draws its own (see noctalia docs).
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=3
blur_params_noise=0.02
blur_params_saturation=1.5

# niri hot-corners top-right
enable_hotarea=1
hotarea_corner=1

# niri environment {}
env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORMTHEME,qt5ct
env=QT_QPA_PLATFORMTHEME_QT6,qt6ct

source=~/.config/mango/window-rules.conf
source=~/.config/mango/binds.conf
source-optional=~/.config/mango/shell.conf
source-optional=~/.config/mango/host.conf
