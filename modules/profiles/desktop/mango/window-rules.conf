# Port of niri/window-rules.kdl. Mango has no per-window corner radius or
# blur toggle; global blur covers transparent windows.
# width/height below 1 are a share of the screen; offsetx/offsety are % from
# the center, 100 is the screen edge.

windowrule=scroller_proportion:1.0,appid:^(cursor|dev\.zed\.Zed)$
windowrule=isfloating:1,width:0.5,height:0.8,title:^Zed — Settings$

windowrule=isfloating:1,width:500,height:700,focused_opacity:0.8,unfocused_opacity:0.8,appid:^(org\.gnome\.Calculator|io\.github\.tanaybhomia\.Whisp)$
windowrule=scroller_proportion:0.6,focused_opacity:0.8,unfocused_opacity:0.8,appid:^io\.missioncenter\.MissionCenter

windowrule=isfloating:1,monitor:^DP-,width:0.15,height:0.05,offsetx:100,offsety:-100,title:^\(unset\)$

# Password managers: float top-right, hide from screen capture.
windowrule=isfloating:1,width:0.3,height:0.75,offsetx:80,offsety:-50,shield_when_capture:1,focused_opacity:0.9,unfocused_opacity:0.9,appid:^(org\.keepassxc\.KeePassXC|org\.gnome\.World\.Secrets|blueman-manager)$
windowrule=isfloating:1,width:0.3,height:0.75,offsetx:80,offsety:-50,shield_when_capture:1,focused_opacity:0.9,unfocused_opacity:0.9,title:^Proton Pass$

windowrule=focused_opacity:0.9,unfocused_opacity:0.9,appid:^(org\.gnome\.|gnome)
# Later rules win: keep Showtime opaque.
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:^org\.gnome\.Showtime$

windowrule=scroller_proportion:0.4,appid:^(org\.wezfurlong\.wezterm|ghostty|kitty|org\.gnome\.NautilusPreviewer)$

windowrule=offsetx:100,offsety:-100,appid:^steam$,title:^notificationtoasts_\d+_desktop$

windowrule=focused_opacity:0.9,unfocused_opacity:0.9,appid:^cursor$
windowrule=focused_opacity:0.8,unfocused_opacity:0.8,appid:^com\.github\.th_ch\.youtube_music$

windowrule=isfloating:1,appid:(org\.quickshell$|com\.danklinux\.dms|vicinae)
