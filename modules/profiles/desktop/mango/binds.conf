# Port of niri/keybinds-default.kdl. Niri columns map to scroller windows,
# niri workspaces map to tags. Shell binds (panels, media keys, Print,
# Mod+Tab) live in shell-*.conf.
# Mango limits a line to 255 characters.

bind=SUPER+SHIFT,r,reload_config

# Apps
bind=SUPER,t,spawn,kitty
bind=SUPER,z,spawn_shell,zen-twilight || zen-beta
bind=SUPER,p,spawn,proton-pass
bind=SUPER,b,spawn,blueman-manager
bind=HYPER,space,spawn,handy --toggle-transcription
bind=HYPER+SHIFT,space,spawn,handy --toggle-post-process
bind=SUPER,period,spawn_shell,flatpak kill io.github.tanaybhomia.Whisp || flatpak run io.github.tanaybhomia.Whisp

# niri Mod+Space also opens the overview. That search works only on niri.
bind=SUPER,space,spawn,vicinae toggle
bind=SUPER,x,toggleoverview
bind=SUPER,q,killclient

# Focus and move (niri: focus-column / move-column)
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down

# Monitors
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,l,focusmon,right
bind=SUPER+SHIFT,k,focusmon,up
bind=SUPER+SHIFT,j,focusmon,down
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,l,tagmon,right
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,j,tagmon,down

# Tags (niri: workspace up/down)
bind=SUPER,Next,viewtoright
bind=SUPER,Prior,viewtoleft
bind=SUPER,u,viewtoright
bind=SUPER,i,viewtoleft
bind=SUPER+CTRL,Next,tagtoright
bind=SUPER+CTRL,Prior,tagtoleft
bind=SUPER+CTRL,u,tagtoright
bind=SUPER+CTRL,i,tagtoleft
axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright
axisbind=SUPER+CTRL,UP,tagtoleft

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+CTRL,1,tag,1
bind=SUPER+CTRL,2,tag,2
bind=SUPER+CTRL,3,tag,3
bind=SUPER+CTRL,4,tag,4
bind=SUPER+CTRL,5,tag,5
bind=SUPER+CTRL,6,tag,6
bind=SUPER+CTRL,7,tag,7
bind=SUPER+CTRL,8,tag,8
bind=SUPER+CTRL,9,tag,9

# Columns (niri: consume-or-expel, preset widths, maximize)
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right
bind=SUPER,r,switch_proportion_preset
bind=SUPER,a,set_proportion,1.0
bind=SUPER+CTRL,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,f,togglefloating
bind=SUPER,c,centerwin
bind=SUPER+ALT,space,switch_keyboard_layout

bind=SUPER+SHIFT,e,quit
bind=CTRL+ALT,Delete,quit

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
