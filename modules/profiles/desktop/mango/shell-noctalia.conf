# Port of niri/shell-noctalia.kdl and keybinds-noctalia.kdl.
# Noctalia starts from its systemd unit (gnome/home.nix) on graphical-session.target.

border_radius=5

windowrule=isfloating:1,width:1080,height:920,appid:^dev\.noctalia\.Noctalia$

bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,n,spawn,noctalia msg panel-toggle control-center notifications
bind=SUPER,m,spawn,noctalia msg panel-toggle control-center system
bind=SUPER,l,spawn,noctalia msg session lock
bind=SUPER+SHIFT,y,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,Tab,spawn,noctalia msg window-switcher
bind=SUPER+SHIFT,p,spawn,noctalia msg dpms-off

bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=ALT,Print,spawn,noctalia msg screenshot-fullscreen
bind=CTRL,Print,spawn,noctalia msg screenshot-fullscreen all

bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bindl=NONE,XF86AudioNext,spawn,noctalia msg media next
bindl=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bindl=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
