# Port of niri/outputs-desktop.kdl. The portrait 4K screen shows up as
# HDMI-A-1 or HDMI-A-2, the 1440p screen as DP-1 or DP-2.
# rr:1 is 90° counter-clockwise, like niri transform "90".

monitorrule=name:^HDMI-A-[12]$,width:3840,height:2160,refresh:60,scale:1.3,rr:1,x:0,y:0
monitorrule=name:^DP-[12]$,width:2560,height:1440,refresh:165,scale:1,vrr:1,x:1665,y:700,primary:1
# HDR is off. It needs the Vulkan renderer, and scenefx (blur, shadows,
# radius) has only GLES. Track wlrfx/scenefx#192. When scenefx gets Vulkan,
# add env=WLR_RENDERER,vulkan to config.conf and hdr:1 to the DP rule above.

# Portrait screen: full-width columns, like niri's per-output layout.
tagrule=id:*,monitor_name:^HDMI-A-[12]$,layout_name:scroller,scroller_default_proportion:1.0

exec-once=zen-twilight || zen-beta
exec-once=pear-desktop

windowrule=tags:1,monitor:^HDMI-A-[12]$,scroller_proportion:1.0,appid:^(zen-twilight|zen-beta|com\.github\.th_ch\.youtube_music)$
windowrule=monitor:^DP-[12]$,appid:^War Thunder$
# Picture-in-Picture: float at the top of the portrait screen.
windowrule=isfloating:1,monitor:^HDMI-A-[12]$,width:1.0,height:0.315,offsety:-100,appid:^zen(-twilight|-beta)?$,title:^Picture-in-Picture$
