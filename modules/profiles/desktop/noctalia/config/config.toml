config_version = 8

[backdrop]
enabled = true

[bar]
order = [ "Main", "Side" ]

    [bar.Main]
    background_opacity = 0.44999998994171619
    capsule = true
    capsule_radius = 0
    capsule_thickness = 0.79999998584389687
    center = [ "clock", "media" ]
    concave_edge_corners = false
    enabled = false
    end = [ "tray", "notifications", "clipboard", "volume", "brightness", "battery", "control-center", "session" ]
    font_family = "Inter Display"
    font_weight = 300
    margin_edge = 5
    margin_ends = 353
    margin_opposite_edge = 5
    radius = 0
    start = [ "wallpaper", "workspaces" ]
    thickness = 31
    widget_spacing = 10

        [bar.Main.monitor.DP-1]
        enabled = true

    [bar.Side]
    enabled = false

        [bar.Side.monitor.HDMI-A-1]
        enabled = true

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 208.0
    box_width = 432.0
    cx = 1431.0
    cy = 157.0
    output = "HDMI-A-1"
    rotation = -0.0
    type = "media_player"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        hide_when_no_media = true
        layout = "horizontal"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 112.0
    box_width = 288.0
    cx = 1407.0
    cy = 357.0
    output = "HDMI-A-1"
    rotation = -0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = true
        display = "graph"
        shadow = true
        show_label = true
        stat = "cpu_usage"
        stat2 = "cpu_temp"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 96.0
    box_width = 272.0
    cx = 1175.0
    cy = 597.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        show_forecast = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 1280.0
    cy = 1241.5
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 831.0
    cy = 2755.5
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[shell]
font_family = "Inter Display"
panel_anchor_bar = "default"

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Gruvbox"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/jadee/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/jadee/Pictures/Wallpapers/Hugo_Charlemont_Bauerngarten.jpg"

    [wallpaper.last]
    path = "/home/jadee/Pictures/Wallpapers/Hugo_Charlemont_Bauerngarten.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/jadee/Pictures/Wallpapers/Hugo_Charlemont_Bauerngarten.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/jadee/Pictures/Wallpapers/Hugo_Charlemont_Bauerngarten.jpg"

[widget.control-center]
glyph = "snowflake"
