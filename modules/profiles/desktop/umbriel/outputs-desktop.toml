# Port of niri/outputs-desktop.kdl. Outputs match by "make model serial"
# (see `umbriel outputs`), not by connector.
# Connector names (DP-1/DP-2, HDMI-A-1/HDMI-A-2) change with the GPU driver load order.

[general]
autostart = [
    "pear-desktop",
    # YouTube Music above Zen on the portrait screen. Umbriel has no rule for the
    # order of columns: a new tiled window opens right after the focused column.
    # So Zen waits until the YouTube Music window is open, for 10 s at most.
    '''i=0; until umbriel windows | grep -q 'th-ch\.youtube-music' || [ "$i" -ge 100 ]; do sleep 0.1; i=$((i + 1)); done; zen-twilight || zen-beta''',
    # Make the AW3926QW the X11 primary output. Wine's X11 driver uses it as the
    # primary monitor, and GE-Proton reads it from xrandr for its Wayland driver.
    # Without it, games size themselves to the portrait screen at 0,0.
    '''xrandr --output "$(umbriel outputs --json | jq -r '(.outputs? // .)[] | select(.model == "AW3926QW") | .name')" --primary''',
]

# HDR for Proton games by default. As an X11 window a game only gets sRGB;
# through Proton's Wayland driver the NVIDIA driver also offers HDR10.
# DXVK_HDR lets DXVK and vkd3d-proton report it; PROTON_ENABLE_HDR is
# GE-Proton's switch for the same. Umbriel publishes these to the systemd user
# manager, so Steam started in this session gets them (restart Umbriel and
# Steam after a change). One game can opt out with
# `PROTON_ENABLE_WAYLAND=0 %command%`. Proton CachyOS turns Steam Input off
# under Wayland; GE-Proton keeps it.
[environment]
PROTON_ENABLE_WAYLAND = "1"
PROTON_ENABLE_HDR = "1"
DXVK_HDR = "1"

# This host uses the black palette variant (hosts/desktop/profiles.nix), so
# inactive windows get its main background (bg-primary #110c0b), fully opaque.
# config.toml sets the brown border of the active window.
[colors.border]
unfocused = "#110c0bff"

# Window sizes on the AW3926QW in quarters, up to full size. One list serves
# both Mod+R (width) and Mod+E (height within a column), so 100% replaces a
# separate full-width bind. The portrait workspaces set their own presets
# below, so this list applies to the ultrawide only.
[layout]
extent_presets = [0.25, 0.5, 0.75, 1.0]
# The Noctalia bar on the ultrawide reserves no space and covers 3 to 28 px.
# A 15 px strut moves windows from 13 to 28 px, so they barely touch the bar.
# 20 would clear it completely.
struts = { top = 10 }

# Mod+A sets the focused window to 90% width, not full width. It is not a
# toggle: Mod+R goes back to a preset. On the portrait screen it sets 90%
# height. This bind overrides keybinds.toml on this host only.
[keybinds]
"Mod+A" = { action = "window-set-primary-extent:0.9", repeat = false }

[output."Dell Inc. DELL S2722QC 88THMD3"]
mode = "3840x2160@60"
scale = 1.3
transform = "90"
position = [0, 0]
# Vertical strip on the portrait screen: windows stack top to bottom, and the
# strip scrolls up and down. Workspaces sit side by side. The extent is the
# window height here: two windows fill the screen.
workspace_axis = "horizontal"
layout.scrolling.default_extent_fraction = 0.5

[output."Dell Inc. AW3926QW C2DR7K4"]
mode = "5120x2160@165"
scale = 1.2
# niri used x=1665, which leaves a gap. Umbriel moves the pointer between
# outputs only when they touch, and the portrait screen is 1661.5 wide.
position = [1661, 200]
focus_at_startup = true
# The whole desktop runs in HDR. SDR content shows at sdr_white (203 cd/m²).
# Umbriel mixes translucent windows in linear light here, so they look more
# transparent than on the SDR portrait screen. "auto" evens that out, but the
# SDR desktop looked worse (2026-10-24).
# The monitor advertises HDR only while Smart HDR is on in its menu.
hdr = "on"
# niri renders 10-bit by default. Umbriel defaults to 8-bit.
bit_depth = 10

# Portrait screen sizes and struts, from the niri portrait layout. Umbriel sets
# these per workspace only, and a rule must name an index, so there is one rule
# per workspace that Mod+1 to Mod+9 reach. One preset list serves both Mod+R
# (height on the vertical strip) and Mod+E (width within a row): niri's heights
# 0.315, 0.5, and 0.685, plus 1.0 for full width. niri had a bottom strut of 25.
# The Noctalia dock on this screen reserves its own space, so the bottom strut
# is 0 and only the layout gap separates the windows from the dock.
[[workspace]]
index = 1
output = "Dell Inc. DELL S2722QC 88THMD3"
layout.extent_presets = [0.315, 0.5, 0.685, 1.0]
layout.struts = { top = 15, bottom = 0 }

[[workspace]]
index = 2
output = "Dell Inc. DELL S2722QC 88THMD3"
layout.extent_presets = [0.315, 0.5, 0.685, 1.0]
layout.struts = { top = 15, bottom = 0 }

[[workspace]]
index = 3
output = "Dell Inc. DELL S2722QC 88THMD3"
layout.extent_presets = [0.315, 0.5, 0.685, 1.0]
layout.struts = { top = 15, bottom = 0 }

[[workspace]]
index = 4
output = "Dell Inc. DELL S2722QC 88THMD3"
layout.extent_presets = [0.315, 0.5, 0.685, 1.0]
layout.struts = { top = 15, bottom = 0 }

[[workspace]]
index = 5
output = "Dell Inc. DELL S2722QC 88THMD3"
layout.extent_presets = [0.315, 0.5, 0.685, 1.0]
layout.struts = { top = 15, bottom = 0 }

[[workspace]]
index = 6
output = "Dell Inc. DELL S2722QC 88THMD3"
layout.extent_presets = [0.315, 0.5, 0.685, 1.0]
layout.struts = { top = 15, bottom = 0 }

[[workspace]]
index = 7
output = "Dell Inc. DELL S2722QC 88THMD3"
layout.extent_presets = [0.315, 0.5, 0.685, 1.0]
layout.struts = { top = 15, bottom = 0 }

[[workspace]]
index = 8
output = "Dell Inc. DELL S2722QC 88THMD3"
layout.extent_presets = [0.315, 0.5, 0.685, 1.0]
layout.struts = { top = 15, bottom = 0 }

[[workspace]]
index = 9
output = "Dell Inc. DELL S2722QC 88THMD3"
layout.extent_presets = [0.315, 0.5, 0.685, 1.0]
layout.struts = { top = 15, bottom = 0 }

# Browser
[[window_rule]]
match.app_id = ['^zen-twilight$', '^zen-beta$']
match.title = '^(?!Picture-in-Picture$)'
default_output = "Dell Inc. DELL S2722QC 88THMD3"
default_workspace = 1
# Height on the vertical strip (niri default-window-height 0.685)
default_scrolling_extent = 0.685

# YouTube Music
[[window_rule]]
match.app_id = '^com\.github\.th-ch\.youtube-music$'
default_output = "Dell Inc. DELL S2722QC 88THMD3"
default_workspace = 1
# Fills the rest of the screen below or above the browser
default_scrolling_extent = 0.315

# Games: open on the AW3926QW and use VRR while focused. GE-Proton tags its
# windows proton-game, and Wine marks them with the game content type.
# Match fields must all match, so these are two rules. Per-game rules below
# come later and win.
[[window_rule]]
match.xdg_tag = '^proton-game$'
default_output = "Dell Inc. AW3926QW C2DR7K4"
vrr = "always"

[[window_rule]]
match.content_type = "game"
default_output = "Dell Inc. AW3926QW C2DR7K4"
vrr = "always"

# The X11 window reports "War Thunder (Vulkan, 64bit)".
[[window_rule]]
match.app_id = '^War Thunder'
default_output = "Dell Inc. AW3926QW C2DR7K4"
default_maximize_to_edges = true
opacity = 1.0
vrr = "always"

# Forza Horizon 6 on Proton's Wayland driver (needed for HDR, see
# [environment] above). GE-Proton reports the exe name, Proton CachyOS the
# Steam app id. The game
# starts in a small window and enters fullscreen only once its window covers
# the output, so open it maximized to the edges.
[[window_rule]]
match.app_id = ['^forzahorizon6\.exe$', '^steam_app_2483190$']
default_output = "Dell Inc. AW3926QW C2DR7K4"
default_maximize_to_edges = true
vrr = "always"

# Cursor and Zed open at 90% width here, not full width (window-rules.toml).
# This file loads after window-rules.toml, so this rule wins. Games keep
# default_maximize_to_edges above.
[[window_rule]]
match.app_id = ['^cursor$', '^dev\.zed\.Zed$']
default_scrolling_extent = 0.9

# kitty opens at a quarter of the width here, not 0.4 (window-rules.toml).
[[window_rule]]
match.app_id = '^kitty$'
default_scrolling_extent = 0.25

# Open the zen browser picture-in-picture player as floating by default.
[[window_rule]]
match.app_id = ['^zen-twilight$', '^zen-beta$', '^zen$']
match.title = '^Picture-in-Picture$'
default_floating = true
default_floating_size = { width = 1.0, height = 0.315 }
default_position = { x = 0, y = 0, anchor = "top_left" }
default_output = "Dell Inc. DELL S2722QC 88THMD3"
opacity = 1.0
