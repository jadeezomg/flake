# Port of niri/window-rules.kdl. Rules apply in order, and later values win.
# niri background-effect { blur true } is blur = true. niri xray false is
# blur_optimized = false. Umbriel has no exclude, no block-out-from
# screen-capture, and no popup corner radius. The DMS layer rules are not
# ported.

# Cursor and Zed IDE at full width
[[window_rule]]
match.app_id = ['^cursor$', '^dev\.zed\.Zed$']
default_scrolling_extent = 1.0

[[window_rule]]
match.title = '^Zed — Settings$'
default_floating = true
default_floating_size = { width = 0.5, height = 0.8 }

# GNOME Calculator and Whisp
[[window_rule]]
match.app_id = ['^org\.gnome\.Calculator$', '^io\.github\.tanaybhomia\.Whisp$']
default_floating = true
default_floating_size_px = { width = 500, height = 700 }
opacity = 0.8
blur = true
blur_optimized = false

[[window_rule]]
match.app_id = '^io\.missioncenter\.MissionCenter'
default_scrolling_extent = 0.6
opacity = 0.8
blur = true

# Zed popup/helper windows can report no title and get tiled fullscreen.
[[window_rule]]
match.title = '^\(unset\)$'
default_floating = true
default_output = "Dell Inc. AW3926QW C2DR7K4"
# niri used 0.15 x 0.05 of the screen. Umbriel fractions start at 0.1.
default_floating_size_px = { width = 640, height = 90 }
default_position = { x = 10, y = 10, anchor = "top_right" }

# Password managers and Bluetooth: float top-right. The app-id and the title
# rule need separate entries, because match fields must all match.
[[window_rule]]
match.app_id = ['^org\.keepassxc\.KeePassXC$', '^org\.gnome\.World\.Secrets$', 'blueman-manager']
default_floating = true
default_floating_size = { width = 0.3, height = 0.75 }
default_position = { x = 100, y = 100, anchor = "top_right" }
opacity = 0.9
blur = true

[[window_rule]]
match.title = '^Proton Pass$'
default_floating = true
default_floating_size = { width = 0.3, height = 0.75 }
default_position = { x = 100, y = 100, anchor = "top_right" }
opacity = 0.9
blur = true

# GNOME applications
[[window_rule]]
match.app_id = ['^org\.gnome\.', '^gnome']
opacity = 0.9
blur = true

# Later rules win: keep the Showtime video player opaque (niri excluded it).
[[window_rule]]
match.app_id = '^org\.gnome\.Showtime$'
opacity = 1.0
blur = false

# kitty asks for blur itself (background_blur in kitty.conf) through
# ext-background-effect. Umbriel lacks that protocol, so this rule turns it on.
[[window_rule]]
match.app_id = '^kitty$'
blur = true

# Terminal applications
[[window_rule]]
match.app_id = ['^org\.wezfurlong\.wezterm$', 'ghostty', 'kitty', 'org\.gnome\.NautilusPreviewer']
default_scrolling_extent = 0.4

[[window_rule]]
match.app_id = 'steam'
match.title = '^notificationtoasts_\d+_desktop$'
default_position = { x = 10, y = 10, anchor = "top_right" }

[[window_rule]]
match.app_id = 'cursor'
opacity = 0.9
blur = true

# niri also set geometry-corner-radius 15 here, but the shell rule (5) loaded
# later and won. These apps keep the global corner_radius from shell.toml.
[[window_rule]]
match.app_id = ['zen', 'org\.gnome', 'dev\.zed\.Zed', 'ghostty']
blur = true
blur_popups = true

# Zen menus are opaque, but each popup surface has a fully transparent margin
# for its shadow. Popup blur fills that margin with the blurred wallpaper, so
# the menu gets a see-through frame. blur_ignore_alpha would skip the margin,
# but it also applies to the main window, whose chrome is translucent.
[[window_rule]]
match.app_id = 'zen'
blur_popups = false

[[window_rule]]
match.app_id = '^com\.github\.th-ch\.youtube-music$'
opacity = 0.8
blur = true

# Open DMS windows (quickshell) and Vicinae as floating
[[window_rule]]
match.app_id = ['org\.quickshell$', 'com\.danklinux\.dms', 'vicinae']
default_floating = true
blur_optimized = false

# Vicinae runs as a layer-shell surface (USE_LAYER_SHELL), so the window rule
# above does not reach it. On niri, Vicinae asks for blur itself through
# ext-background-effect. Umbriel lacks that protocol, so this rule turns the
# blur on, with xray off (blur_optimized = false). 0.1 skips the fully
# transparent corners.
[[layer_rule]]
match.namespace = '^vicinae$'
blur = true
blur_ignore_alpha = 0.1
blur_optimized = false
