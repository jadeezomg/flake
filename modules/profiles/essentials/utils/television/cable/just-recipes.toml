# Aligned with upstream Television community channel "just-recipes":
# https://alexpasmantier.github.io/television/community/channels-unix/#just-recipes
# Cable sources live under `modules/profiles/essentials/utils/television/cable/` (like navi cheats).
# Invoke: `tv --cable-dir …/cable just-recipes <cwd>` or bare `tv just-recipes` after HM
# links this file to ~/.config/television/cable/. `JUSTFILE` / `FLAKE` from root `Justfile`.

[metadata]
name = "just-recipes"
description = "Select recipes from a Justfile"
requirements = ["just", "bash"]

[source]
command = [
  "bash -lc 'bash \"${FLAKE}/scripts/shell/just-recipes.bash\" \"${FLAKE}\"'",
]
no_sort = true
frecency = false

[preview]
command = "bash -lc 'just --justfile \"${JUSTFILE}\" -s \"{}\" 2>/dev/null'"

[ui]
layout = "landscape"
input_bar_position = "bottom"
input_header = "Just · Enter/F5 = run recipe · Tab = multi-select"
input_prompt = "recipe › "

[ui.preview_panel]
size = 46
border_type = "rounded"

[ui.results_panel]
border_type = "rounded"

[ui.input_bar]
border_type = "rounded"

[ui.remote_control]
disabled = true

[keybindings]
enter = "actions:execute-recipe"
f5 = "actions:execute-recipe"

[actions.execute-recipe]
description = "Execute a justfile recipe"
# Deliberately no `cd "${FLAKE}"` here. just already runs a recipe in the
# directory of its justfile, so the cd changed nothing for ordinary recipes —
# but it destroyed the caller's directory for `[no-cd]` recipes such as
# `flatten-dir`, which must act on the directory the shell is in.
command = "bash -lc 'exec just --justfile \"${JUSTFILE}\" \"$1\"' -- '{}'"
mode = "execute"
