[project]
name = "flake-scripts"
version = "0.1.0"
description = "Flake maintenance scripts: symlink-check, check-packages, read-defaults, zen-session"
requires-python = ">=3.10"
dependencies = ["lz4", "rich"]

[project.scripts]
symlink-check = "flake_scripts.symlinks:main"
zen-session   = "flake_scripts.zen.zen_session:main"
check-packages = "flake_scripts.check_packages:main"
read-defaults  = "flake_scripts.read_defaults:main"

[dependency-groups]
dev = ["ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flake_scripts"]
