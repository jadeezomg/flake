[project]
name = "zen-session"
version = "0.1.0"
description = "Zen browser session tools (extract pins, sync to Nix, dump, check-spaces)"
requires-python = ">=3.10"
dependencies = ["lz4"]

[project.scripts]
zen-session = "zen_session:main"

[dependency-groups]
dev = ["ruff", "ty"]

# Usage (from repo root)
#   uv run --project scripts/zen-session scripts/zen-session/zen_session.py --help
#   uv run --project scripts/zen-session scripts/zen-session/zen_session.py --profile <DIR> <command> [command options]
#   Example:
#   uv run --project scripts/zen-session scripts/zen-session/zen_session.py extract --dump-tab-sample
#
# Global options
#   --profile, -p DIR
#       Override the Zen browser profile directory. If omitted:
#       - $ZEN_PROFILE_ROOT if set
#       - else platform defaults from extract_pinned_tabs (see README)
#
# Commands and options
#   extract
#     --nix
#         Print extracted pinned tabs as a Nix snippet.
#     --dump-tab-sample
#         Print a sample tab object structure to stderr for debugging.
#
#   sync
#     (no command-specific options)
#     Writes spaces.nix and pins.nix via sync_flake_profiles (target dir from host / ZEN_OUTPUT_PROFILE).
#
#   dump
#     --full
#         Write full session JSON to session_dump.json.
#     --tabs N
#         Print N tabs (script default: 3 when omitted).
#
#   check-spaces
#     (no command-specific options)
#     Shows where workspace/space names appear in session files.
